<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="B1 / Weatherproof enclosure body"><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10 0L0 5L10 10" fill="none" stroke="#246c80"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#27424f}.title{font-size:22px;font-weight:600}.label{font-size:14px}.small{font-size:12px;fill:#657c86}.part{fill:#edf3f6;stroke:#3b6273;stroke-width:1.3}.hole{fill:white;stroke:#3b6273;stroke-width:1}.edge{stroke:#3b6273;stroke-width:1;fill:none}.ext{stroke:#8da5af;stroke-width:.8}.dim{stroke:#246c80;stroke-width:1;marker-start:url(#arrow);marker-end:url(#arrow)}.dash{fill:none;stroke:#b38838;stroke-dasharray:5 4;stroke-width:1}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title" text-anchor="start">B1 / Weatherproof enclosure body</text><text x="35" y="65" class="small" text-anchor="start">Product envelope; added holes specified by designer</text><rect x="100" y="160" width="300" height="180" rx="10" class="part"/><circle cx="250" cy="238" r="28" class="hole"/><line x1="100" y1="160" x2="100" y2="125" class="ext"/><line x1="400" y1="160" x2="400" y2="125" class="ext"/><line x1="100" y1="120" x2="400" y2="120" class="dim"/><text x="250" y="112" class="label" text-anchor="middle">150 nominal envelope</text><line x1="100" y1="160" x2="70" y2="160" class="ext"/><line x1="100" y1="340" x2="70" y2="340" class="ext"/><line x1="65" y1="160" x2="65" y2="340" class="dim"/><text class="label" transform="translate(55,250) rotate(-90)" text-anchor="middle">90 overall</text><line x1="100" y1="316" x2="400" y2="316" class="dash"/><text x="100" y="370" class="small" text-anchor="start">RIGHT SIDE · not a moulding section</text><text x="495" y="160" class="label" text-anchor="start">Zulkit enclosure · 150 × 150 × 90</text><text x="495" y="200" class="label" text-anchor="start">Side access: Ø28, centred on body wall</text><text x="495" y="240" class="label" text-anchor="start">Four back holes align to B3: 117 × 116</text><text x="495" y="280" class="label" text-anchor="start">Included lid closes the downward-facing opening</text><text x="495" y="340" class="label" text-anchor="start">Lid split and 3 mm walls are illustrative.</text><text x="495" y="380" class="label" text-anchor="start">Purchased shell geometry is not fabrication CAD.</text><line x1="35" y1="478" x2="965" y2="478" class="ext"/><text x="35" y="500" class="small" text-anchor="start">BEECAM · REV 0.3 · DIMENSIONS mm · DO NOT SCALE</text><text x="965" y="500" class="small" text-anchor="end">REFERENCE ONLY</text></svg>