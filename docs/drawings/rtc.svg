<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="E18 / Adafruit DS3231 STEMMA QT"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10 0L0 5L10 10" fill="none" stroke="#28758a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#25424f}.title{font-size:22px;font-weight:bold}.label{font-size:14px}.small{font-size:12px;fill:#59717d}.edge{stroke:#466571;stroke-width:1.2;fill:none}.ext{stroke:#8da5af;stroke-width:.8}.dim{stroke:#28758a;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title" text-anchor="start">E18 / Adafruit DS3231 STEMMA QT</text><text x="35" y="67" class="small" text-anchor="start">Official Adafruit Eagle + STEP</text><rect x="191.5" y="165" width="127" height="88.9" rx="10" fill="#bec8ca" stroke="#466571"/><line x1="191.5" y1="165" x2="191.5" y2="139" class="ext"/><line x1="318.5" y1="165" x2="318.5" y2="139" class="ext"/><line x1="191.5" y1="133" x2="318.5" y2="133" class="dim"/><text x="255" y="125" class="label" text-anchor="middle">25.4</text><line x1="191.5" y1="165" x2="161.5" y2="165" class="ext"/><line x1="191.5" y1="253.9" x2="161.5" y2="253.9" class="ext"/><line x1="155.5" y1="165" x2="155.5" y2="253.9" class="dim"/><text class="label" transform="translate(145.5 209.45) rotate(-90)" text-anchor="middle">17.78</text><circle cx="204.2" cy="177.7" r="7.5" fill="white" stroke="#466571"/><circle cx="305.8" cy="177.7" r="7.5" fill="white" stroke="#466571"/><circle cx="255" cy="209.45" r="30" fill="#d4dadd" stroke="#466571"/><text x="490" y="158" class="label" text-anchor="start">BOARD PLAN / INSTALLED ORIENTATION</text><text x="490" y="192" class="label" text-anchor="start">25.4 × 17.78 mm PCB</text><text x="490" y="231" class="label" text-anchor="start">Mounting pitch: 20.32</text><text x="490" y="266" class="label" text-anchor="start">2 × Ø3 board holes; battery side faces inward</text><text x="490" y="310" class="small" text-anchor="start">External precision RTC, mounted battery-side up on two brass</text><text x="490" y="331" class="small" text-anchor="start">standoffs. Its two Ø3 mm board holes are 20.32 mm apart; the</text><text x="490" y="352" class="small" text-anchor="start">other two nearby acrylic holes remain unused. Two JST SH</text><text x="490" y="373" class="small" text-anchor="start">connectors; one connects to the HAT.</text><line x1="35" y1="598" x2="965" y2="598" class="ext"/><text x="35" y="620" class="small" text-anchor="start">BEECAM · REV 0.4 · DIMENSIONS mm · REFERENCE ONLY</text><text x="965" y="620" class="small" text-anchor="end">NOT A FABRICATION DRAWING</text></svg>