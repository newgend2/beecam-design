<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="E3 / Camera M2 screws"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10 0L0 5L10 10" fill="none" stroke="#28758a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#25424f}.title{font-size:22px;font-weight:bold}.label{font-size:14px}.small{font-size:12px;fill:#59717d}.edge{stroke:#466571;stroke-width:1.2;fill:none}.ext{stroke:#8da5af;stroke-width:.8}.dim{stroke:#28758a;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title" text-anchor="start">E3 / Camera M2 screws</text><text x="35" y="67" class="small" text-anchor="start">Assembly specification + DXF holes</text><rect x="100" y="216" width="42" height="64" rx="3" fill="#bac5ca" stroke="#466571"/><rect x="142" y="233" width="225" height="30" rx="3" fill="#bac5ca" stroke="#466571"/><text x="100" y="332" class="small" text-anchor="start">Select length to suit joint</text><text x="455" y="160" class="label" text-anchor="start">4 used · M2</text><text x="455" y="207" class="small" text-anchor="start">Four M2 screws and nuts hold the camera. Place one M2.5 nut and</text><text x="455" y="228" class="small" text-anchor="start">one M2 washer between the acrylic and PCB at each mounting</text><text x="455" y="249" class="small" text-anchor="start">point. Select screws from the Kadrick 660-piece kit with enough</text><text x="455" y="270" class="small" text-anchor="start">length to engage the retaining nuts.</text><text x="455" y="386" class="small" text-anchor="start">Allow secure engagement without bottoming out.</text><line x1="35" y1="598" x2="965" y2="598" class="ext"/><text x="35" y="620" class="small" text-anchor="start">BEECAM · REV 1.0 · DIMENSIONS mm · REFERENCE ONLY</text><text x="965" y="620" class="small" text-anchor="end">NOT A FABRICATION DRAWING</text></svg>