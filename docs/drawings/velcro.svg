<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="E7 / Circular hook-and-loop pairs"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10 0L0 5L10 10" fill="none" stroke="#28758a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#25424f}.title{font-size:22px;font-weight:bold}.label{font-size:14px}.small{font-size:12px;fill:#59717d}.edge{stroke:#466571;stroke-width:1.2;fill:none}.ext{stroke:#8da5af;stroke-width:.8}.dim{stroke:#28758a;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title" text-anchor="start">E7 / Circular hook-and-loop pairs</text><text x="35" y="67" class="small" text-anchor="start">Designer count + linked diameter</text><circle cx="220" cy="235" r="85" fill="#343b40" stroke="#466571"/><line x1="135" y1="320" x2="135" y2="371" class="ext"/><line x1="305" y1="320" x2="305" y2="371" class="ext"/><line x1="135" y1="365" x2="305" y2="365" class="dim"/><text x="220" y="357" class="label" text-anchor="middle">Ø20</text><rect x="140" y="420" width="160" height="10" rx="3" fill="#343b40" stroke="#466571"/><rect x="140" y="432" width="160" height="10" rx="3" fill="#343b40" stroke="#466571"/><text x="135" y="473" class="small" text-anchor="start">Paired side view · thickness approximate</text><text x="450" y="158" class="label" text-anchor="start">5 paired connections / 10 individual dots</text><text x="450" y="196" class="label" text-anchor="start">One dot on acrylic; mating dot on lid</text><text x="450" y="245" class="small" text-anchor="start">Five paired connections attach the acrylic to the lid: ten</text><text x="450" y="266" class="small" text-anchor="start">individual adhesive dots. Black appearance follows the photos;</text><text x="450" y="287" class="small" text-anchor="start">the supplied listing is the white 20 mm variant. Positions and</text><text x="450" y="308" class="small" text-anchor="start">compressed 3 mm pair thickness are illustrative.</text><line x1="35" y1="598" x2="965" y2="598" class="ext"/><text x="35" y="620" class="small" text-anchor="start">BEECAM · REV 0.4 · DIMENSIONS mm · REFERENCE ONLY</text><text x="965" y="620" class="small" text-anchor="end">NOT A FABRICATION DRAWING</text></svg>