<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="635" viewBox="0 0 1000 635" role="img" aria-label="B2 / Modified enclosure lid"><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10 0L0 5L10 10" fill="none" stroke="#246c80"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#27424f}.title{font-size:22px;font-weight:600}.label{font-size:14px}.small{font-size:12px;fill:#657c86}.part{fill:#edf3f6;stroke:#3b6273;stroke-width:1.3}.hole{fill:white;stroke:#3b6273;stroke-width:1}.edge{stroke:#3b6273;stroke-width:1;fill:none}.ext{stroke:#8da5af;stroke-width:.8}.dim{stroke:#246c80;stroke-width:1;marker-start:url(#arrow);marker-end:url(#arrow)}.dash{fill:none;stroke:#b38838;stroke-dasharray:5 4;stroke-width:1}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title" text-anchor="start">B2 / Modified enclosure lid</text><text x="35" y="65" class="small" text-anchor="start">Two added Ø22 mm ports · lens and included cable gland</text><rect x="100" y="155" width="360" height="360" rx="14" class="part"/><line x1="280" y1="140" x2="280" y2="530" class="dash"/><line x1="85" y1="335" x2="475" y2="335" class="dash"/><circle cx="280" cy="236.5231529" r="26.4" class="hole"/><line x1="272" y1="236.5231529" x2="288" y2="236.5231529" class="ext"/><line x1="280" y1="228.5231529" x2="280" y2="244.5231529" class="ext"/><circle cx="190.41928000000001" cy="424.58072" r="26.4" class="hole"/><line x1="182.41928000000001" y1="424.58072" x2="198.41928000000001" y2="424.58072" class="ext"/><line x1="190.41928000000001" y1="416.58072" x2="190.41928000000001" y2="432.58072" class="ext"/><line x1="100" y1="155" x2="100" y2="117" class="ext"/><line x1="460" y1="155" x2="460" y2="117" class="ext"/><line x1="100" y1="112" x2="460" y2="112" class="dim"/><text x="280" y="104" class="label" text-anchor="middle">150 overall</text><line x1="100" y1="155" x2="70" y2="155" class="ext"/><line x1="100" y1="515" x2="70" y2="515" class="ext"/><line x1="65" y1="155" x2="65" y2="515" class="dim"/><text class="label" transform="translate(55,335) rotate(-90)" text-anchor="middle">150 overall</text><text x="525" y="150" class="label" text-anchor="start">EXTERIOR LID VIEW</text><text x="525" y="184" class="label" text-anchor="start">Latch / camera edge shown at top</text><text x="525" y="224" class="label" text-anchor="start">Camera: Ø22 at X75, Y116.032</text><text x="525" y="256" class="label" text-anchor="start">Cable: Ø22 at X37.675, Y37.675</text><text x="525" y="293" class="label" text-anchor="start">Datum: bottom-left of 150 × 150 envelope</text><text x="525" y="334" class="label" text-anchor="start">Port locations derived from centred Pi plate.</text><text x="525" y="366" class="label" text-anchor="start">Confirm plate-to-lid registration before drilling.</text><text x="525" y="412" class="label" text-anchor="start">Camera port is the midpoint of the inner</text><text x="525" y="438" class="label" text-anchor="start">camera bolt-hole pair, not the rectangle centre.</text><text x="100" y="555" class="small" text-anchor="start">Hinge, latch and rounded-shell details are schematic.</text><line x1="35" y1="593" x2="965" y2="593" class="ext"/><text x="35" y="615" class="small" text-anchor="start">BEECAM · REV 0.3 · DIMENSIONS mm · DO NOT SCALE</text><text x="965" y="615" class="small" text-anchor="end">REFERENCE ONLY</text></svg>