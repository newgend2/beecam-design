<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="E8 / Raspberry Pi Zero 2 W"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10 0L0 5L10 10" fill="none" stroke="#28758a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#25424f}.title{font-size:22px;font-weight:bold}.label{font-size:14px}.small{font-size:12px;fill:#59717d}.edge{stroke:#466571;stroke-width:1.2;fill:none}.ext{stroke:#8da5af;stroke-width:.8}.dim{stroke:#28758a;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title" text-anchor="start">E8 / Raspberry Pi Zero 2 W</text><text x="35" y="67" class="small" text-anchor="start">Official mechanical drawing</text><rect x="185.76923076923077" y="165" width="138.46153846153845" height="300" rx="10" fill="#bbddc5" stroke="#466571"/><line x1="185.76923076923077" y1="165" x2="185.76923076923077" y2="139" class="ext"/><line x1="324.2307692307692" y1="165" x2="324.2307692307692" y2="139" class="ext"/><line x1="185.76923076923077" y1="133" x2="324.2307692307692" y2="133" class="dim"/><text x="255" y="125" class="label" text-anchor="middle">30</text><line x1="185.76923076923077" y1="165" x2="155.76923076923077" y2="165" class="ext"/><line x1="185.76923076923077" y1="465" x2="155.76923076923077" y2="465" class="ext"/><line x1="149.76923076923077" y1="165" x2="149.76923076923077" y2="465" class="dim"/><text class="label" transform="translate(139.76923076923077 315) rotate(-90)" text-anchor="middle">65</text><circle cx="201.92307692307693" cy="448.8461538461538" r="6.346153846153846" fill="white" stroke="#466571"/><circle cx="201.92307692307693" cy="181.15384615384616" r="6.346153846153846" fill="white" stroke="#466571"/><circle cx="308.0769230769231" cy="448.8461538461538" r="6.346153846153846" fill="white" stroke="#466571"/><circle cx="308.0769230769231" cy="181.15384615384616" r="6.346153846153846" fill="white" stroke="#466571"/><rect x="190.3846153846154" y="197.30769230769232" width="23.076923076923073" height="235.38461538461536" rx="1" fill="#35434b" stroke="#466571"/><text x="490" y="158" class="label" text-anchor="start">BOARD PLAN / INSTALLED ORIENTATION</text><text x="490" y="192" class="label" text-anchor="start">65 × 30 mm PCB</text><text x="490" y="231" class="label" text-anchor="start">Mounting pitch: 23 × 58</text><text x="490" y="266" class="label" text-anchor="start">Nominal board holes: Ø2.75</text><text x="490" y="310" class="small" text-anchor="start">Pre-soldered 40-pin GPIO version. Mounted on four brass</text><text x="490" y="331" class="small" text-anchor="start">standoffs at the acrylic Pi hole pattern. Nominal board</text><text x="490" y="352" class="small" text-anchor="start">mounting pitch is 58 × 23 mm; acrylic design pitch is 57.988</text><text x="490" y="373" class="small" text-anchor="start">× 23.012 mm. USB centres and board outline follow the</text><text x="490" y="394" class="small" text-anchor="start">official drawing. Component bodies and GPIO header are</text><text x="490" y="415" class="small" text-anchor="start">reference geometry.</text><line x1="35" y1="598" x2="965" y2="598" class="ext"/><text x="35" y="620" class="small" text-anchor="start">BEECAM · REV 1.0 · DIMENSIONS mm · REFERENCE ONLY</text><text x="965" y="620" class="small" text-anchor="end">NOT A FABRICATION DRAWING</text></svg>