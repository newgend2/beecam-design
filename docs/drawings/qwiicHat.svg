<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="E14 / SparkFun Qwiic HAT DEV-14459"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10 0L0 5L10 10" fill="none" stroke="#28758a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#25424f}.title{font-size:22px;font-weight:bold}.label{font-size:14px}.small{font-size:12px;fill:#59717d}.edge{stroke:#466571;stroke-width:1.2;fill:none}.ext{stroke:#8da5af;stroke-width:.8}.dim{stroke:#28758a;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title" text-anchor="start">E14 / SparkFun Qwiic HAT DEV-14459</text><text x="35" y="67" class="small" text-anchor="start">Official SparkFun Eagle board</text><rect x="197.5325" y="165" width="114.93499999999999" height="261.62" rx="10" fill="#f5c5c9" stroke="#466571"/><line x1="197.5325" y1="165" x2="197.5325" y2="139" class="ext"/><line x1="312.4675" y1="165" x2="312.4675" y2="139" class="ext"/><line x1="197.5325" y1="133" x2="312.4675" y2="133" class="dim"/><text x="255" y="125" class="label" text-anchor="middle">22.987</text><line x1="197.5325" y1="165" x2="167.5325" y2="165" class="ext"/><line x1="197.5325" y1="426.62" x2="167.5325" y2="426.62" class="ext"/><line x1="161.5325" y1="165" x2="161.5325" y2="426.62" class="dim"/><text class="label" transform="translate(151.5325 295.81) rotate(-90)" text-anchor="middle">52.324</text><rect x="207.5325" y="225" width="25" height="30" rx="1" fill="#35434b" stroke="#466571"/><rect x="207.5325" y="269.45" width="25" height="30" rx="1" fill="#35434b" stroke="#466571"/><rect x="207.5325" y="313.9" width="25" height="30" rx="1" fill="#35434b" stroke="#466571"/><rect x="207.5325" y="358.35" width="25" height="30" rx="1" fill="#35434b" stroke="#466571"/><text x="490" y="158" class="label" text-anchor="start">BOARD PLAN / INSTALLED ORIENTATION</text><text x="490" y="192" class="label" text-anchor="start">52.324 × 22.987 mm PCB</text><text x="490" y="231" class="label" text-anchor="start">2×20 shared GPIO connection</text><text x="490" y="266" class="label" text-anchor="start">4 Qwiic ports along the outer edge</text><text x="490" y="310" class="small" text-anchor="start">Full-size DEV-14459 Qwiic HAT, with four JST SH ports. Shares</text><text x="490" y="331" class="small" text-anchor="start">the 2×20 pins just under Witty Pi and projects outwards</text><text x="490" y="352" class="small" text-anchor="start">beside the Pi. This is the specified HAT, not the Qwiic pHAT.</text><text x="490" y="373" class="small" text-anchor="start">Outline and connector positions come from SparkFun CAD.</text><line x1="35" y1="598" x2="965" y2="598" class="ext"/><text x="35" y="620" class="small" text-anchor="start">BEECAM · REV 0.4 · DIMENSIONS mm · REFERENCE ONLY</text><text x="965" y="620" class="small" text-anchor="end">NOT A FABRICATION DRAWING</text></svg>