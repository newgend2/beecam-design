<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="E22 / JST SH 4-pin cables"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10 0L0 5L10 10" fill="none" stroke="#28758a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#25424f}.title{font-size:22px;font-weight:bold}.label{font-size:14px}.small{font-size:12px;fill:#59717d}.edge{stroke:#466571;stroke-width:1.2;fill:none}.ext{stroke:#8da5af;stroke-width:.8}.dim{stroke:#28758a;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title" text-anchor="start">E22 / JST SH 4-pin cables</text><text x="35" y="67" class="small" text-anchor="start">Designer corrected quantity and wiring</text><rect x="105" y="206" width="70" height="40" rx="3" fill="#394950" stroke="#466571"/><rect x="342" y="206" width="70" height="40" rx="3" fill="#394950" stroke="#466571"/><path d="M175 217 C225 140 290 292 342 217" stroke="#202429" stroke-width="5" fill="none"/><path d="M175 223 C225 146 290 298 342 223" stroke="#c23545" stroke-width="5" fill="none"/><path d="M175 229 C225 152 290 304 342 229" stroke="#d5b832" stroke-width="5" fill="none"/><path d="M175 235 C225 158 290 310 342 235" stroke="#3579b0" stroke-width="5" fill="none"/><text x="470" y="160" class="label" text-anchor="start">200 mm each · 1 mm pitch</text><text x="470" y="211" class="small" text-anchor="start">Two 200 mm cables: HAT to RTC, and HAT to OLED. The OLED</text><text x="470" y="232" class="small" text-anchor="start">cable has one connector removed and black/red/yellow/blue</text><text x="470" y="253" class="small" text-anchor="start">wires soldered at the display. Curves show connection</text><text x="470" y="274" class="small" text-anchor="start">topology, not measured routing length.</text><text x="105" y="350" class="label" text-anchor="start">OLED pin edge, viewed from screen side:</text><text x="105" y="384" class="label" text-anchor="start">BLACK  /  RED  /  YELLOW  /  BLUE</text><text x="105" y="433" class="small" text-anchor="start">2 cables / 2 installed routes</text><line x1="35" y1="598" x2="965" y2="598" class="ext"/><text x="35" y="620" class="small" text-anchor="start">BEECAM · REV 0.4 · DIMENSIONS mm · REFERENCE ONLY</text><text x="965" y="620" class="small" text-anchor="end">NOT A FABRICATION DRAWING</text></svg>