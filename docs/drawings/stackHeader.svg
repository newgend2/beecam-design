rect x="244" y="388" width="12" height="6" rx="0" fill="#d0b761" stroke="#466571"/><rect x="244" y="401" width="12" height="6" rx="0" fill="#d0b761" stroke="#466571"/><rect x="244" y="414" width="12" height="6" rx="0" fill="#d0b761" stroke="#466571"/><rect x="244" y="427" width="12" height="6" rx="0" fill="#d0b761" stroke="#466571"/><text x="460" y="160" class="label" text-anchor="start">2 rows × 20 pins · 2.54 mm pitch</text><text x="460" y="202" class="label" text-anchor="start">Female socket onto Pi GPIO</text><text x="460" y="244" class="label" text-anchor="start">Male pins through HAT to Witty Pi</text><text x="460" y="285" class="label" text-anchor="start">Total height / pin length: to confirm</text><text x="460" y="330" class="small" text-anchor="start">Female end plugs onto the Pi GPIO pins. Long male pins pass</text><text x="460" y="351" class="small" text-anchor="start">through the Qwiic HAT and into the Witty Pi header. Height is</text><text x="460" y="372" class="small" text-anchor="start">illustrative. The supplied short link resolves to the box, so the</text><text x="460" y="393" class="small" text-anchor="start">exact header and pack of eight remain unverified.</text><line x1="35" y1="598" x2="965" y2="598" class="ext"/><text x="35" y="620" class="small" text-anchor="start">BEECAM · REV 0.4 · DIMENSIONS mm · REFERENCE ONLY</text><text x="965" y="620" class="small" text-anchor="end">NOT A FABRICATION DRAWING</text></svg>