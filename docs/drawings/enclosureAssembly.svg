<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-label="03 / Enclosure mounting and camera alignment"><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10 0L0 5L10 10" fill="none" stroke="#246c80"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#27424f}.title{font-size:22px;font-weight:600}.label{font-size:14px}.small{font-size:12px;fill:#657c86}.part{fill:#edf3f6;stroke:#3b6273;stroke-width:1.3}.hole{fill:white;stroke:#3b6273;stroke-width:1}.edge{stroke:#3b6273;stroke-width:1;fill:none}.ext{stroke:#8da5af;stroke-width:.8}.dim{stroke:#246c80;stroke-width:1;marker-start:url(#arrow);marker-end:url(#arrow)}.dash{fill:none;stroke:#b38838;stroke-dasharray:5 4;stroke-width:1}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title" text-anchor="start">03 / Enclosure mounting and camera alignment</text><text x="35" y="65" class="small" text-anchor="start">Box top attaches beneath upper arm; lid faces imaging platform</text><rect x="95" y="115" width="340" height="6" rx="1" class="part"/><rect x="240" y="75" width="50" height="40" rx="0" class="part"/><rect x="115" y="121" width="300" height="180" rx="10" class="part"/><line x1="115" y1="277" x2="415" y2="277" class="dash"/><rect x="130" y="280" width="270" height="6" rx="0" class="part"/><line x1="310" y1="265" x2="310" y2="460" class="dash"/><rect x="280" y="270" width="60" height="4" rx="0" class="part"/><circle cx="310" cy="290" r="8" class="hole"/><text x="470" y="95" class="label" text-anchor="start">220 mm arm</text><text x="470" y="132" class="label" text-anchor="start">3 mm outer acrylic mounting plate</text><text x="470" y="178" class="label" text-anchor="start">90 mm enclosure height</text><text x="470" y="223" class="label" text-anchor="start">Internal plate: 3 mm acrylic</text><text x="470" y="265" class="label" text-anchor="start">Camera optical axis points down</text><text x="470" y="307" class="label" text-anchor="start">Lens aligned above vane centre</text><text x="100" y="410" class="small" text-anchor="start">ASSEMBLED SIDE STACK · SPACING SCHEMATIC</text><text x="100" y="455" class="small" text-anchor="start">Port and plate geometry use CAD; lid depth, pads and camera spacers remain approximate.</text><text x="100" y="485" class="small" text-anchor="start">Adjust the upper arm in the stem slot to set camera height.</text><line x1="35" y1="528" x2="965" y2="528" class="ext"/><text x="35" y="550" class="small" text-anchor="start">BEECAM · REV 1.0 · DIMENSIONS mm · DO NOT SCALE</text><text x="965" y="550" class="small" text-anchor="end">REFERENCE ONLY</text></svg>