<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="E15 / SSD1306 OLED display"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10 0L0 5L10 10" fill="none" stroke="#28758a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#25424f}.title{font-size:22px;font-weight:bold}.label{font-size:14px}.small{font-size:12px;fill:#59717d}.edge{stroke:#466571;stroke-width:1.2;fill:none}.ext{stroke:#8da5af;stroke-width:.8}.dim{stroke:#28758a;stroke-width:1;marker-start:url(#a);marker-end:url(#a)}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="40" class="title" text-anchor="start">E15 / SSD1306 OLED display</text><text x="35" y="67" class="small" text-anchor="start">Product specification · schematic PCB</text><rect x="187.5" y="165" width="135" height="135" rx="10" fill="#c5dfed" stroke="#466571"/><line x1="187.5" y1="165" x2="187.5" y2="139" class="ext"/><line x1="322.5" y1="165" x2="322.5" y2="139" class="ext"/><line x1="187.5" y1="133" x2="322.5" y2="133" class="dim"/><text x="255" y="125" class="label" text-anchor="middle">27 ≈</text><line x1="187.5" y1="165" x2="157.5" y2="165" class="ext"/><line x1="187.5" y1="300" x2="157.5" y2="300" class="ext"/><line x1="151.5" y1="165" x2="151.5" y2="300" class="dim"/><text class="label" transform="translate(141.5 232.5) rotate(-90)" text-anchor="middle">27 ≈</text><circle cx="197.5" cy="290" r="5.5" fill="white" stroke="#466571"/><circle cx="197.5" cy="175" r="5.5" fill="white" stroke="#466571"/><circle cx="312.5" cy="290" r="5.5" fill="white" stroke="#466571"/><circle cx="312.5" cy="175" r="5.5" fill="white" stroke="#466571"/><rect x="197.5" y="185" width="115" height="95" rx="2" fill="#202d3c" stroke="#466571"/><text x="490" y="158" class="label" text-anchor="start">BOARD PLAN / INSTALLED ORIENTATION</text><text x="490" y="192" class="label" text-anchor="start">0.96 inch · 128 × 64 pixels</text><text x="490" y="231" class="label" text-anchor="start">Mounting pitch: 23 × 23</text><text x="490" y="266" class="label" text-anchor="start">Nominal board holes: Ø2.2</text><text x="490" y="310" class="small" text-anchor="start">Hosyond blue/yellow I2C OLED, one display from a five-pack.</text><text x="490" y="331" class="small" text-anchor="start">Mount above one end of Witty Pi on 10 mm brass spacers. The</text><text x="490" y="352" class="small" text-anchor="start">PCB outline and hole layout are schematic. Viewed from the</text><text x="490" y="373" class="small" text-anchor="start">screen side with the pin edge at the top, solder black, red,</text><text x="490" y="394" class="small" text-anchor="start">yellow and blue wires from left to right.</text><line x1="35" y1="598" x2="965" y2="598" class="ext"/><text x="35" y="620" class="small" text-anchor="start">BEECAM · REV 1.0 · DIMENSIONS mm · REFERENCE ONLY</text><text x="965" y="620" class="small" text-anchor="end">NOT A FABRICATION DRAWING</text></svg>